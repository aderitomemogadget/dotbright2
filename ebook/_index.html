	<script type="text/javascript">
		window.onclick = function(e)
		{
			var str=e.target.href;

			if(str)
			{
				if(str.indexOf("ref_") > -1){
					var link = document.getElementById('add-to-cart');
					link.click();
					e.preventDefault();
				}
			}
		};
	</script>
